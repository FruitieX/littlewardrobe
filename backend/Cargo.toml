[package]
name = "littlewardrobe-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
argon2 = "=0.6.0"
rand = "=0.10.3"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
chacha20poly1305 = "=0.11.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
async-stream = "=0.3.6"
tower-http = { version = "=0.7.1", features = ["fs", "trace", "limit", "set-header", "catch-panic"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
